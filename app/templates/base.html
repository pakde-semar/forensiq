<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ForensiQ{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --fq-sidebar: #161b22;
      --fq-brand:   #00bfae;
    }
    body { background: #0d1117; color: #e6edf3; min-height: 100vh; }
    .sidebar {
      width: 220px; min-height: 100vh; background: var(--fq-sidebar);
      border-right: 1px solid #30363d; position: fixed; top: 0; left: 0; padding-top: 1rem;
    }
    .sidebar .brand { color: var(--fq-brand); font-weight: 700; font-size: 1.2rem; padding: 0 1rem 1.5rem; }
    .sidebar .nav-link { color: #8b949e; padding: .45rem 1rem; font-size: .9rem; border-radius: 6px; margin: 1px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #21262d; color: #e6edf3; }
    .sidebar .nav-link i { width: 18px; text-align: center; margin-right: 8px; }
    .main-content { margin-left: 220px; padding: 2rem; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; }
    .table { --bs-table-bg: transparent; --bs-table-striped-bg: #21262d; }
    .badge-priority-critical  { background:#dc3545; }
    .badge-priority-high      { background:#fd7e14; }
    .badge-priority-medium    { background:#ffc107; color:#000; }
    .badge-priority-low       { background:#198754; }
    .badge-priority-informational { background:#0dcaf0; color:#000; }
    .status-open     { color:#58a6ff; }
    .status-active   { color:#3fb950; }
    .status-review   { color:#d29922; }
    .status-closed   { color:#8b949e; }
    .status-archived { color:#6e7681; }
    .audit-entry { font-family: monospace; font-size: .8rem; color: #8b949e; border-left: 2px solid #30363d; padding-left: .5rem; }
    .ev-hash { font-family: monospace; font-size: .75rem; color: #8b949e; }
    .tab-content { padding-top: 1.5rem; }
    .nav-tabs .nav-link { color: #8b949e; border-color: transparent; }
    .nav-tabs .nav-link.active { color: #e6edf3; background: #161b22; border-color: #30363d #30363d #161b22; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="sidebar d-flex flex-column">
  <div class="brand"><i class="fa fa-shield-halved me-2"></i>ForensiQ</div>
  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
        <i class="fa fa-gauge"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/cases' in request.url.path %}active{% endif %}" href="/cases/">
        <i class="fa fa-folder-open"></i> Cases
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/agency' in request.url.path %}active{% endif %}" href="/agency/">
        <i class="fa fa-building"></i> Agency
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/yara' in request.url.path %}active{% endif %}" href="/yara">
        <i class="fa fa-shield-halved"></i> Yara Rules
      </a>
    </li>
  </ul>
  <div class="mt-auto p-3">
    {# Quick search #}
    <div style="position:relative;">
      <input type="text" id="quickSearch" placeholder="Quick search… (/)"
             class="form-control form-control-sm"
             style="background:#21262d;border-color:#30363d;color:#e6edf3;font-size:.8rem;"
             autocomplete="off">
      <div id="quickSearchResults"
           style="display:none;position:absolute;bottom:38px;left:0;right:0;
                  background:#1c2128;border:1px solid #30363d;border-radius:6px;
                  z-index:999;max-height:260px;overflow-y:auto;font-size:.82rem;"></div>
    </div>
    <div class="mt-2" style="font-size:.72rem;color:#6e7681;">ForensiQ v0.1</div>
  </div>
</nav>

<div class="main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

<style>
  mark.search-hl {
    background: #ffd700;
    color: #000;
    border-radius: 2px;
    padding: 0 1px;
  }
</style>

<script>
  // ── Quick search (sidebar) ───────────────────────────────────────────────
  const _qs  = document.getElementById('quickSearch');
  const _qsr = document.getElementById('quickSearchResults');
  let _qsTimer = null;

  const TYPE_ICON = { case: 'fa-folder-open', evidence: 'fa-box-archive' };
  const TYPE_COLOR = { case: '#00bfae', evidence: '#f0883e' };

  _qs?.addEventListener('input', () => {
    clearTimeout(_qsTimer);
    const q = _qs.value.trim();
    if (q.length < 2) { _qsr.style.display = 'none'; return; }
    _qsTimer = setTimeout(async () => {
      try {
        const r = await fetch(`/cases/search?q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (!d.results || !d.results.length) {
          _qsr.innerHTML = '<div style="padding:8px 12px;color:#8b949e">No results</div>';
          _qsr.style.display = 'block';
          return;
        }
        _qsr.innerHTML = d.results.map(item => `
          <a href="${item.url}" style="display:block;padding:7px 12px;color:#e6edf3;
             text-decoration:none;border-bottom:1px solid #21262d;"
             onmouseover="this.style.background='#21262d'"
             onmouseout="this.style.background=''">
            <span style="color:${TYPE_COLOR[item.type]};font-size:.75rem;">
              <i class="fa ${TYPE_ICON[item.type]} me-1"></i>${item.type}
            </span><br>
            <span style="font-weight:600">${item.label}</span>
            <span style="color:#8b949e;font-size:.75rem;"> — ${item.sub}</span>
          </a>`).join('');
        _qsr.style.display = 'block';
      } catch(e) {}
    }, 280);
  });

  _qs?.addEventListener('keydown', e => {
    if (e.key === 'Escape') { _qsr.style.display = 'none'; _qs.blur(); }
    if (e.key === 'Enter' && _qs.value.trim().length >= 2) {
      window.location = `/cases/?q=${encodeURIComponent(_qs.value.trim())}`;
    }
  });

  document.addEventListener('click', e => {
    if (!_qs?.contains(e.target) && !_qsr?.contains(e.target))
      _qsr.style.display = 'none';
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== _qs
        && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) {
      e.preventDefault();
      _qs?.focus();
    }
  });
</script>
</body>
</html>
